name: Update API Doc

concurrency:
  group: api-doc-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, dev]
    paths:
      - "app/src/Controllers/**"
  workflow_dispatch:

jobs:
  api-doc:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"

      - name: Generate API doc
        run: php app/scripts/apiDoc.php

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add doc/API_DOC.md
          git diff --staged --quiet || git commit -m "docs: regenerate API doc"
          git push
