services:
  app:
    build:
      target: production
    networks:
      - camagru_network
    expose:
      - "9000"
    environment:
      - NODE_ENV=production

  nginx:
    container_name: camagru_nginx
    build:
      target: production
      args:
        ENV: prod
    ports:
      - "8443:443"

  database:
    build:
      target: production