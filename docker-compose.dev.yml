services:
  app:
    build:
      target: development
    networks:
      - camagru_network
    expose:
      - "9000"
    volumes:
      - ./app:/usr/src/app
      - uploads_volume:/usr/src/app/public/uploads

  nginx:
    build:
      target: development
      args:
        ENV: dev
    ports:
      - "8080:80"

  database:
    build:
      target: base
