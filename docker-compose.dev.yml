services:
  app:
    build:
      target: development
    env_file:
      - .env.dev
    volumes:
      - ./app:/var/www/html
      - vendor_volume:/var/www/html/vendor

  client:
    build:
      context: ./app/client
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./app/client:/app
      - node_modules:/app/node_modules

  nginx:
    build:
      target: development
      args:
        ENV: dev
    env_file:
      - .env.dev
    ports:
      - "8080:80"
    volumes:
      - ./app/public:/var/www/html/public:ro

  database:
    build:
      target: base
    env_file:
      - .env.dev

volumes:
  vendor_volume:
  node_modules:
