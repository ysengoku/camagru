services:
  app:
    build:
      target: development
    networks:
      - camagru_network
    expose:
      - "9000"
    volumes:
      - ./app:/var/www/html

  nginx:
    build:
      target: development
      args:
        ENV: dev
    ports:
      - "8080:80"

  database:
    build:
      target: base
